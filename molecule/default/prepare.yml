# code: language=ansible
---
- name: Prepare local test fixtures
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Generate ephemeral SSH keypair for test user
      community.crypto.openssh_keypair:
        path: "{{ molecule_ephemeral_directory }}/id_ed25519"
        type: ed25519

- name: Bootstrap Python interpreter
  hosts: all
  gather_facts: false
  tasks:
    - name: Check for python3
      ansible.builtin.raw: python3 --version
      register: __python3_check
      changed_when: false
      failed_when: false

    - name: Install python3 (Alpine bootstrap)
      when: __python3_check.rc != 0
      ansible.builtin.raw: apk add --no-cache python3
      changed_when: true

- name: Refresh package caches
  hosts: all
  tasks:
    - name: Update apt cache
      when: ansible_facts['os_family'] == 'Debian'
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Update apk cache
      when: ansible_facts['distribution'] == 'Alpine'
      community.general.apk:
        update_cache: true

    - name: Ensure sudo is available for become in tests
      when: ansible_facts['distribution'] == 'Alpine'
      community.general.apk:
        name: sudo
        state: present
